<!DOCTYPE html>
<html lang="en" xmls="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가입 인증 메일</title>
    <th:block th:include="~{/css/common.css}"></th:block>
</head>

<body>
    <h1>가입 인증 메일</h1>
    <p>안녕하세요.</p>
    <p>새로운 계정을 가입해주셔서 감사합니다.</p>
    <p>아래 버튼을 클릭하여 이메일 인증을 완료해주세요.</p>
    <a th:href="${verificationUrl}"
        style="background-color: #007bff; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none;">이메일
        인증</a>
    <p>만약 이 인증 요청을 하지 않았다면 이 이메일을 무시하셔도 됩니다.</p>
    <p>감사합니다,</p>
    <p>발신 전용 이메일입니다.</p>
</body>

</html>
