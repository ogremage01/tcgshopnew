spring:
  application:
    name: shop-backend
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}

  profiles:
    # dev: 로컬 개발 | demo: 시연·스테이징 서버 | prod: 운영
    active: ${SPRING_PROFILES_ACTIVE:dev}
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/shop?useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
      data-source-properties:
        # JdbcTemplate.batchUpdate 사용 시 JDBC 드라이버 수준의 배치 최적화.
        # true로 설정하면 MariaDB JDBC 드라이버가 여러 INSERT 문을
        # 하나의 네트워크 패킷으로 합쳐(rewrite) DB로 전송한다.
        # 예) INSERT INTO t VALUES(1),(2),(3) 형태로 변환됨.
        # PriceBatchSaver의 batchUpdate 성능에 직접적인 영향을 준다.
        rewriteBatchedStatements: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${GOOGLE_MAIL_ADDRESS:}
    password: ${GOOGLE_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writeTimeout: 5000
          ssl:
            enable: true

server:
  port: ${SERVER_PORT:18567}
  forward-headers-strategy: framework
  tomcat:
    max-part-count: ${TOMCAT_MAX_PART_COUNT:100}

user:
  terms-version: ${USER_TERMS_VERSION:1.0}
  privacy-version: ${USER_PRIVACY_VERSION:1.0}

app:
  cors:
    # 운영(prod 프로필) 기본값: https://tcgshop.example — 환경 변수 CORS_ORIGINS로 덮어쓸 수 있음
    origins: ${CORS_ORIGINS:http://localhost:3000}
  security:
    permit-metadata-without-auth: false
    strict-origin-check: ${STRICT_ORIGIN_CHECK:true}
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-change-in-production-must-be-long-enough}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  auth:
    refresh-expiration-ms: ${REFRESH_EXPIRATION_MS:1209600000} # 14 days
  # 개인정보(주소, 전화번호) AES-256 암호화용 키. Base64 인코딩된 32바이트 권장.
  personal-data-encryption-key: ${PERSONAL_DATA_ENCRYPTION_KEY:}
  cache:
    search-facets:
      # true면 Redis로 facet 목록 캐시(TTL 적용). 연결: spring.data.redis.*
      enabled: ${SEARCH_FACETS_CACHE_ENABLED:false}
      ttl: ${SEARCH_FACETS_CACHE_TTL:60s}

